[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden by alembic/env.py, which reads SQLALCHEMY_URL from the application
# settings (or ALEMBIC_DATABASE_URL) — keep the two in sync by not relying on
# this value at all.
sqlalchemy.url = sqlite:///./stackwise.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
